<!doctype html>
<!--
  One xterm.js terminal inside the app's WebView. The app owns the socket
  (it needs the device token); this page only draws and reports keystrokes
  and size through the `Pirc` bridge. xterm.js is copied in at build time.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="stylesheet" href="xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #terminal {
        position: absolute;
        inset: 6px 4px 4px 8px;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script>
      const settings = JSON.parse(Pirc.settings());
      document.body.style.background = settings.theme.background;
      const term = new Terminal({
        cursorBlink: true,
        fontFamily: 'monospace',
        fontSize: settings.fontSize,
        lineHeight: 1.1,
        scrollback: 5000,
        theme: settings.theme,
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('terminal'));
      term.onData((data) => Pirc.input(data));
      let size = '';
      const resize = () => {
        try {
          fit.fit();
        } catch {
          return;
        }
        const next = term.cols + 'x' + term.rows;
        if (next === size) return;
        size = next;
        Pirc.resize(term.cols, term.rows);
      };
      new ResizeObserver(resize).observe(document.getElementById('terminal'));
      window.pirc = {
        write: (data) => term.write(data),
        reset: (data) => {
          term.reset();
          term.write(data);
        },
        focus: () => term.focus(),
        fontSize: (value) => {
          term.options.fontSize = value;
          resize();
        },
        theme: (theme) => {
          term.options.theme = theme;
          document.body.style.background = theme.background;
        },
      };
      resize();
      Pirc.ready();
    </script>
  </body>
</html>
