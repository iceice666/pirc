name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    # Native unit/integration tests, web checks and Rust-only conformance.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Native runtime: fmt, clippy, unit tests and the conformance
      # suite, which drives the built executables.
      # Pinned (currently the flake's toolchain): a new clippy lint must not
      # fail CI on unchanged code (clippy runs with -D warnings).
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The Azure mirror can throttle browser/ffmpeg dependencies for many
      # minutes. Use Ubuntu's upstream archive with the same signed packages.
      - name: Use Ubuntu archive for browser dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -E -i 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done

      # The browser conformance scenarios (crates/pirc-conformance/tests/node_browser.rs)
      # and the pirc-node browser tests need a Chromium and, for recordings,
      # ffmpeg; they skip without them, except under PIRC_BROWSER_REQUIRED=1
      # (below), where a missing one fails them.
      # Chrome for Testing of the dev shell's Chromium version, which the
      # snapshots were recorded with. The tests hand it to the node under
      # test as PIRC_BROWSER_EXECUTABLE (its environment is cleared).
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: 153.0.8010.47
          install-dependencies: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun run check
        env:
          PIRC_BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          PIRC_BROWSER_REQUIRED: '1'

  nix:
    # The Nix packages' fixed-output hashes: cargoHash (nix/package.nix)
    # must follow every Cargo.lock change, version bumps included, and
    # nodeModulesHash (nix/web.nix) every bun.lock change. Building only the
    # dependency derivations checks both without compiling the packages
    # (a stale cargoHash once broke `nix build` of v0.4.1 unnoticed). Also
    # evaluates both packages and checks the Nix formatting.
    name: Nix hashes and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: nix fmt -- --check flake.nix nix/*.nix
      - run: |
          nix eval --raw .#pirc-gateway.drvPath
          nix eval --raw .#pirc-node.drvPath
      - run: >-
          nix build --no-link --print-build-logs
          .#pirc-gateway.cargoDeps .#pirc-node.cargoDeps .#pirc-gateway.web.nodeModules

  size:
    name: Rust executable sizes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Fails when a release executable exceeds crates/size-budget.json.
      - run: bun run size:check

  sandbox-podman:
    # The native Linux sandbox for real (crates/pirc-node/tests/sandbox_native.rs,
    # sandbox_linux_*.rs and sandbox_network.rs): bubblewrap, uid 0 in user
    # namespaces, container root in rootless podman with bubblewrap nested,
    # and the proxy end to end through curl, ssh and nc. The check job has no
    # bubblewrap, so these tests skip there.
    name: Native sandbox (bubblewrap, uid 0, podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install bubblewrap, podman, capability and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap podman uidmap libcap2-bin util-linux git git-lfs curl openssh-client netcat-openbsd
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor,
      # which stops bubblewrap and `unshare -r` for the runner's user.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The image the podman cases run in (Ubuntu 24.04, as the runner, so
      # the test binaries' glibc matches, with bubblewrap).
      - run: >-
          podman build -t localhost/pirc-bwrap-test:latest
          -f crates/pirc-node/tests/fixtures/bwrap.Containerfile
          crates/pirc-node/tests/fixtures
      - run: >-
          cargo test -p pirc-node
          --test sandbox_native --test sandbox_registry --test sandbox_persistence --test agent_process_privacy --test sandbox_linux_uid0
          --test sandbox_linux_readonly --test sandbox_linux_agent
          --test sandbox_linux_panel_git --test sandbox_network
          -- --nocapture
      # Native checkpoint continuation uses real Gateway/Node/Agent processes;
      # its assertion-based suite runs on macOS too, without Linux snapshots.
      - name: Native checkpoint end-to-end acceptance
        run: |
          cargo build --locked -p pirc-gateway -p pirc-node
          cargo test --locked -p pirc-node --lib checkpoints::api::tests -- --test-threads=1
          cargo test --locked -p pirc-conformance --test checkpoints -- --test-threads=1
        env:
          PIRC_CONFORMANCE_BIN_DIR: target/debug
          PIRC_CONFORMANCE_REQUIRED: '1'
          PIRC_CHECKPOINT_NATIVE_REQUIRED: '1'
