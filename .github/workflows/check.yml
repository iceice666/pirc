name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # crates/ (Rust rewrite): fmt, clippy, unit tests and the conformance
      # suite, which drives the built executables.
      # Pinned (currently the flake's toolchain): a new clippy lint must not
      # fail CI on unchanged code (clippy runs with -D warnings).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The browser conformance scenarios (crates/pirc-conformance/tests/node_browser.rs)
      # and the pirc-node browser tests need a Chromium and, for recordings,
      # ffmpeg; they skip without them, except under PIRC_BROWSER_REQUIRED=1
      # (below), where a missing one fails them.
      # Chrome for Testing of the dev shell's Chromium version, which the
      # snapshots were recorded with. The tests hand it to the node under
      # test as PIRC_BROWSER_EXECUTABLE (its environment is cleared).
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 153.0.8010.47
          install-dependencies: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun run check
        env:
          PIRC_BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          PIRC_BROWSER_REQUIRED: '1'

  size:
    name: Rust executable sizes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # Fails when a release executable exceeds crates/size-budget.json.
      - run: bun run size:check

  sandbox-podman:
    # The native Linux sandbox for real (crates/pirc-node/tests/sandbox_native.rs,
    # sandbox_linux_*.rs and sandbox_network.rs): bubblewrap, uid 0 in user
    # namespaces, container root in rootless podman with bubblewrap nested,
    # and the proxy end to end through curl, ssh and nc. The check job has no
    # bubblewrap, so these tests skip there.
    name: Native sandbox (bubblewrap, uid 0, podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap, podman, capability and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap podman uidmap libcap2-bin util-linux git git-lfs curl openssh-client netcat-openbsd
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor,
      # which stops bubblewrap and `unshare -r` for the runner's user.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The image the podman cases run in (Ubuntu 24.04, as the runner, so
      # the test binaries' glibc matches, with bubblewrap).
      - run: >-
          podman build -t localhost/pirc-bwrap-test:latest
          -f crates/pirc-node/tests/fixtures/bwrap.Containerfile
          crates/pirc-node/tests/fixtures
      - run: >-
          cargo test -p pirc-node
          --test sandbox_native --test sandbox_linux_uid0
          --test sandbox_linux_readonly --test sandbox_linux_agent
          --test sandbox_linux_panel_git --test sandbox_network
          -- --nocapture
