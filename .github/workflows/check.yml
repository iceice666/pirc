name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # crates/ (Rust rewrite): fmt, clippy, unit tests and the conformance
      # suite, which drives the built executables.
      # Pinned (currently the flake's toolchain): a new clippy lint must not
      # fail CI on unchanged code (clippy runs with -D warnings).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: bun run check

  size:
    name: Rust executable sizes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # Fails when a release executable exceeds crates/size-budget.json.
      - run: bun run size:check

  sandbox-podman:
    # The native Linux sandbox for real (crates/pirc-node/tests/sandbox_native.rs
    # and sandbox_linux_*.rs): bubblewrap, uid 0 in user namespaces, and
    # container root in rootless podman with bubblewrap nested. The check job
    # has no bubblewrap, so these tests skip there.
    name: Native sandbox (bubblewrap, uid 0, podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap, podman and capability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap podman uidmap libcap2-bin util-linux git
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor,
      # which stops bubblewrap and `unshare -r` for the runner's user.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The image the podman cases run in (Ubuntu 24.04, as the runner, so
      # the test binaries' glibc matches, with bubblewrap).
      - run: >-
          podman build -t localhost/pirc-bwrap-test:latest
          -f crates/pirc-node/tests/fixtures/bwrap.Containerfile
          crates/pirc-node/tests/fixtures
      - run: >-
          cargo test -p pirc-node
          --test sandbox_native --test sandbox_linux_uid0
          --test sandbox_linux_readonly --test sandbox_linux_agent
          --test sandbox_linux_panel_git
          -- --nocapture
