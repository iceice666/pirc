name: Android

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - fixtures/**
      - apps/web/package.json
      - bun.lock
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - fixtures/**
      - apps/web/package.json
      - bun.lock
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The terminal bundles xterm.js from the web client's pinned dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      # Accepts the SDK licenses so the Android Gradle plugin can fetch the
      # platform and build tools it needs.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # Caches Gradle and validates the committed wrapper.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Unit tests and debug build
        working-directory: apps/android
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: unit-test-reports
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pirc-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
