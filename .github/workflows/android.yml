name: Android

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - fixtures/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - fixtures/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flutter/flutter
          ref: ad70ec4617166f1c38e5d2bfd388af71fda14f06
          path: .flutter-sdk
          fetch-depth: 0
          persist-credentials: false

      - name: Add pinned Flutter SDK to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Flutter SDK revision
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          info = json.loads(subprocess.check_output(["flutter", "--version", "--machine"], text=True))
          expected_revision = "ad70ec4617166f1c38e5d2bfd388af71fda14f06"
          expected_version = "3.44.4"
          if info.get("frameworkRevision") != expected_revision or info.get("frameworkVersion") != expected_version:
              raise SystemExit(f"Expected Flutter {expected_version} ({expected_revision}), got {info}")
          print(f"Flutter {info['frameworkVersion']} ({info['frameworkRevision']})")
          PY

      # Accepts the SDK licenses so the Android Gradle plugin can fetch the
      # platform and build tools it needs.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # Caches Gradle and validates the committed wrapper.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Resolve Flutter dependencies
        working-directory: apps/android
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/android
        run: flutter analyze --no-pub

      # Geometry-dependent Flutter widget tests need Arial/Menlo and are run on macOS.
      - name: Build debug APK
        working-directory: apps/android
        run: flutter build apk --debug --no-pub

      - name: Android JVM unit tests
        working-directory: apps/android/android
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: unit-test-reports
          path: apps/android/build/app/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pirc-android-debug
          path: apps/android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
