<meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:24px;font:16px Arial}input{width:100%;height:40px}button{margin-top:20px}</style><form><label>Time zone<input list="schedule-timezones" required spellcheck="false"></label><datalist id="schedule-timezones"><option value="Asia/Taipei"></option><option value="Asia/Tokyo"></option><option value="UTC"></option></datalist><button>Save</button></form><pre id="result"></pre><script>window.submissions=[];document.querySelector('form').onsubmit=e=>{e.preventDefault();submissions.push(document.querySelector('input').value);document.querySelector('#result').textContent=JSON.stringify(submissions)};</script>
