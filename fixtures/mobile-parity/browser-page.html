<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Native browser fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
        color: #20232a;
        font: 16px Arial;
      }
      main {
        background: white;
        padding: 24px;
        border: 1px solid #ddd;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }
      p {
        margin: 0 0 16px;
        color: #555;
      }
      input {
        width: 240px;
        height: 36px;
        padding: 8px;
        border: 1px solid #aaa;
        border-radius: 6px;
      }
      button {
        height: 36px;
        border: 0;
        border-radius: 6px;
        background: #4176e6;
        color: white;
        padding: 0 16px;
        margin-left: 8px;
      }
      #result {
        margin-top: 20px;
        color: #237847;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Native browser fixture</h1>
      <p>Verify native pointer and text input.</p>
      <form>
        <input id="name" aria-label="Name" placeholder="Your name" /><button>Submit</button>
      </form>
      <p id="result">Ready</p>
    </main>
    <script>
      const input = document.querySelector('#name');
      input.onfocus = () => history.replaceState(null, '', '?focused=1');
      input.oninput = () =>
        history.replaceState(null, '', '?typed=' + encodeURIComponent(input.value));
      const submitted = new URLSearchParams(location.search).get('name');
      if (submitted !== null) document.querySelector('#result').textContent = 'Hello, ' + submitted;
      document.querySelector('form').onsubmit = (e) => {
        e.preventDefault();
        const value = document.querySelector('#name').value;
        location.search = '?name=' + encodeURIComponent(value);
      };
    </script>
  </body>
</html>
