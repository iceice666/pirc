[package]
name = "browser-snapshot"
version = "0.0.0"
edition = "2024"
publish = false
description = "M1 spike A: Playwright's AI aria snapshots and aria-ref interaction over raw CDP"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace]
