# Rust rewrite of the server executables; see plans/rust-rewrite.md.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# let-chains
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
