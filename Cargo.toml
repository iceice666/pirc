# Rust rewrite of the server executables; see plans/rust-rewrite.md.
[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway M1 experiments; each is its own Cargo project.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
# The product version (scripts/version.ts keeps it in sync with package.json).
version = "0.3.0"
# let-chains
rust-version = "1.88"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: object key order is part of what models see (tool schemas)
# and decides defaults (the first provider), as in the TypeScript code.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Shipped bytes are the goal of the rewrite: see plans/rust-rewrite.md.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
