[package]
name = "pirc-conformance"
version.workspace = true
description = "Black-box conformance tests for the pirc executables"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The fake push service reads Web Push requests (RFC 8291, VAPID) as a browser would.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
axum = "0.8"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
hkdf = "0.12"
nix = { version = "0.31", features = ["signal"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"

pirc-protocol = { path = "../pirc-protocol" }

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[lints]
workspace = true
