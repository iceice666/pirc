[package]
name = "pirc-providers"
description = "Model transports and the gateway's models.json (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.3"
indexmap.workspace = true
regex-lite = "0.1"
# HTTP/1.1 with rustls; the `ring` provider is installed at runtime, so no
# aws-lc (and no cmake) is built.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
# PKCE challenges (subscription logins).
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

pirc-llm = { path = "../pirc-llm", features = ["oauth", "openai-chat", "anthropic-messages", "openai-completions", "openai-responses", "openai-codex-responses"] }
pirc-config = { path = "../pirc-config" }
pirc-protocol = { path = "../pirc-protocol" }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false }
# Offline regression for distrusted intermediate keys, including cross-signs.
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
