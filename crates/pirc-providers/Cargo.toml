[package]
name = "pirc-providers"
description = "Model transports and the gateway's models.json (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
indexmap.workspace = true
regex-lite = "0.1"
# HTTP/1.1 with rustls; the `ring` provider is installed at runtime, so no
# aws-lc (and no cmake) is built.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "sync", "time"] }

pirc-protocol = { path = "../pirc-protocol" }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
