[package]
name = "pirc-llm"
description = "Explicit-client LLM wire transports extracted from pirc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Independent wire APIs; anthropic-messages preserves both native and Pi paths.
openai-chat = ["_transport"]
anthropic-messages = ["_transport"]
openai-completions = ["_transport"]
openai-responses = ["_transport"]
openai-codex-responses = ["_transport"]
oauth = ["dep:reqwest", "dep:tokio", "dep:base64", "dep:serde_json", "dep:sha2", "dep:getrandom", "dep:form_urlencoded", "tokio/rt", "tokio/net", "tokio/io-util"]
_transport = ["dep:reqwest", "dep:tokio", "dep:regex-lite", "dep:base64", "dep:indexmap", "dep:serde_json"]

[dependencies]
pirc-llm-types = { path = "../pirc-llm-types" }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
form_urlencoded = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
indexmap = { workspace = true, optional = true }
regex-lite = { version = "0.1", optional = true }
serde_json = { workspace = true, optional = true }
# No implicit TLS provider, proxy, trust-store or environment selection here:
# callers construct and inject the client, including its TLS policy.
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { version = "1", features = ["macros", "sync", "time"], optional = true }

[dev-dependencies]
# Synthetic HTTP tests inject an explicit TLS config even if another workspace
# package enables reqwest TLS. Never install a global test crypto provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
