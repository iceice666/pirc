[package]
name = "pirc-agent"
description = "The session agent: loop, tools, RPC and the PTC surface (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3"
indexmap.workspace = true
regex-lite = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

pirc-policy = { path = "../pirc-policy" }
pirc-protocol = { path = "../pirc-protocol" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
