[package]
name = "pirc-agent"
description = "The session agent: loop, tools, RPC and the PTC surface (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
# NFKC for the assistant's quote check (`String.prototype.normalize`), as the gateway's memory.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
indexmap.workspace = true
# kill(2) of a shell command's process group, and the workspace ledger's
# flock(2), without unsafe code.
nix = { version = "0.31", features = ["fs", "signal"] }
regex-lite = "0.1"
# ECMAScript regular expressions: grep patterns, hook matchers, the
# auto-mode deny-list and schema patterns are JavaScript regexes.
regress = "0.12"
sha2 = "0.10"
# Local times of memory records (`localStamp`), from the system's zone files, as the gateway's memory.
tz-rs = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
# Background tasks with `tty: true` run on a pseudo-terminal they control
# (setsid and TIOCSCTTY before exec need code this crate cannot write without
# `unsafe`).
pty-process = { version = "0.5", features = ["async"] }

pirc-config = { path = "../pirc-config" }
pirc-policy = { path = "../pirc-policy" }
pirc-protocol = { path = "../pirc-protocol" }
# The preflight and shared contracts only: QuickJS lives in the guest.
pirc-ptc = { path = "../pirc-ptc", default-features = false }

[dev-dependencies]
# The runtime tests' binary is its own `ptc-guest`.
pirc-ptc = { path = "../pirc-ptc" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

# Scripts run in a real guest process: the test binary dispatches
# `ptc-guest` to the guest itself, so it has its own `main`.
[[test]]
name = "ptc_runtime"
harness = false

[lints]
workspace = true
