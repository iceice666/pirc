[package]
name = "pirc-agent"
description = "The session agent: loop, tools, RPC and the PTC surface (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
indexmap.workspace = true
# kill(2) of a shell command's process group, without unsafe code.
nix = { version = "0.31", features = ["signal"] }
regex-lite = "0.1"
# ECMAScript regular expressions: grep patterns, hook matchers, the
# auto-mode deny-list and schema patterns are JavaScript regexes.
regress = "0.12"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

pirc-policy = { path = "../pirc-policy" }
pirc-protocol = { path = "../pirc-protocol" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
