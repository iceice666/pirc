[package]
name = "pirc-gateway"
description = "pirc gateway: browser API, authentication and routing (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pirc-gateway"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz.workspace = true
# NFKC for memory hashes and search (already linked through `url`).
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
form_urlencoded = "1"
hkdf = "0.12"
http-body-util = "0.1"
# Sources (plans/rewrite/09-sources.md): email headers and bodies (RFC 5322,
# MIME, RFC 2047; full_encoding for Big5 and other non-Unicode mail).
mail-parser = { version = "0.11", features = ["full_encoding"] }
# A Moodle app login's signature (md5 of the site URL and the passport).
md-5 = "0.10"
# access(2) for the brain's prompt files (already linked through pirc-agent).
nix = { version = "0.31", features = ["fs"] }
# Web Push (push.rs): VAPID signatures and RFC 8291 key agreement.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
regex-lite = "0.1"
# Push and web search; the same TLS setup as pirc-providers (ring, no aws-lc).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# IMAP over TLS for email sources, with the platform's roots (already linked through reqwest).
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
sha2 = "0.10"
subtle = "2"
# Local times in memory search, from the system's zone files (no embedded tz database).
tz-rs = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
url = "2"

# The brain (plans/rewrite/02-brain-host.md): the agent loop, without tools.
pirc-agent = { path = "../pirc-agent" }
pirc-config = { path = "../pirc-config" }
pirc-protocol = { path = "../pirc-protocol" }
pirc-providers = { path = "../pirc-providers" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
