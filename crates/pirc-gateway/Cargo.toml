[package]
name = "pirc-gateway"
description = "pirc gateway: browser API, authentication and routing (Rust rewrite, in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pirc-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
# NFKC for memory hashes and search (already linked through `url`).
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
form_urlencoded = "1"
http-body-util = "0.1"
regex-lite = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
sha2 = "0.10"
subtle = "2"
# Local times in memory search, from the system's zone files (no embedded tz database).
tz-rs = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

pirc-config = { path = "../pirc-config" }
pirc-protocol = { path = "../pirc-protocol" }
pirc-providers = { path = "../pirc-providers" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
