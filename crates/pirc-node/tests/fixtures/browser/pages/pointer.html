<!doctype html>
<html lang="en">
  <head>
    <title>Pointer</title>
  </head>
  <body>
    <div style="cursor: pointer" onclick="void 0">Clickable div</div>
    <div style="cursor: pointer">
      <span>Nested span in pointer</span>
      <button>Button inside pointer</button>
    </div>
    <span style="cursor: pointer">Pointer span</span>
    <a href="#anchor">Link</a>
    <div role="button" tabindex="0" style="cursor: pointer">Role button</div>
    <p style="cursor: default">Default cursor</p>
    <label style="cursor: pointer"><input type="checkbox" /> Pointer label</label>
    <button style="cursor: default">Default cursor button</button>
  </body>
</html>
