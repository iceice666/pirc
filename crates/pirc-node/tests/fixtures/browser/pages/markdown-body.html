<!doctype html>
<html lang="en">
  <head>
    <title>Body markdown</title>
  </head>
  <body>
    <header><h1>Site header</h1></header>
    <main><p>Short main.</p></main>
    <section>
      <h2>Outside main</h2>
      <p>
        Most of the text of this page lies outside its main element, so the extraction takes the
        whole body instead of main. This sentence makes that so.
      </p>
      <ul>
        <li>First</li>
        <li>Second</li>
      </ul>
    </section>
  </body>
</html>
