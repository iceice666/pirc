<!doctype html>
<html lang="en">
  <head>
    <title>Secrets</title>
    <script>
      customElements.define(
        'x-secret',
        class extends HTMLElement {
          constructor() {
            super();
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML =
              '<label>Shadow password <input type="password" value="shadow-hunter2" /></label>';
          }
        },
      );
    </script>
  </head>
  <body>
    <h1>Sign in</h1>
    <form
      onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'submitted'"
    >
      <label>Username <input name="username" value="ada" /></label>
      <label>Password <input id="pw" type="password" name="password" value="hunter2" /></label>
      <label>Upper-case type <input type="PASSWORD" name="pin" value="2468" /></label>
      <label>Empty password <input type="password" name="empty" /></label>
      <label
        >Shown password <input type="text" name="password-shown" value="visible-secret"
      /></label>
      <label>One-time code <input name="code" autocomplete="one-time-code" /></label>
      <label>Card <input name="card" placeholder="CVC" /></label>
      <input aria-label="API secret" />
      <label>Passport number <input name="passport" /></label>
      <label for="notes">Notes</label>
      <textarea id="notes"></textarea>
      <label>Recovery words <textarea name="words"></textarea></label>
      <div contenteditable="true" role="textbox" aria-label="Secret note"></div>
      <label><input type="checkbox" name="remember-password" /> Remember password</label>
      <button type="submit">Sign in</button>
    </form>
    <x-secret></x-secret>
    <p>The password is hunter2, said nobody.</p>
    <p id="out"></p>
  </body>
</html>
