<!doctype html>
<html lang="en">
  <head>
    <title>Shadow</title>
    <script>
      customElements.define(
        'x-card',
        class extends HTMLElement {
          constructor() {
            super();
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML =
              '<h2>Card title</h2><slot></slot>' +
              '<label>Shadow input <input id="si" /></label>' +
              '<button id="sb">Shadow button</button><p id="so"></p>';
            root.getElementById('sb').addEventListener('click', () => {
              root.getElementById('so').textContent = 'shadow clicked';
            });
          }
        },
      );
      customElements.define(
        'x-closed',
        class extends HTMLElement {
          constructor() {
            super();
            const root = this.attachShadow({ mode: 'closed' });
            root.innerHTML = '<button>Closed shadow button</button>';
          }
        },
      );
    </script>
  </head>
  <body>
    <h1>Shadow DOM</h1>
    <x-card><span>Slotted text</span></x-card>
    <x-closed></x-closed>
  </body>
</html>
